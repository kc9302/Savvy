:root{--bg:#F5F6F8;--surface:#FFFFFF;--ink:#15171C;--mut:#5F6676;--line:#E2E5EB;--accent:#D6285B;--accent-soft:#FCE6EE;--ok:#1E8E5A;--ok-soft:#DDF3E8;--warn:#B7791F;--warn-soft:#FBEFD6;
  --body:system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1115;--surface:#171A21;--ink:#ECEEF3;--mut:#9AA3B2;--line:#2A2F3A;--accent:#FF6B93;--accent-soft:#3A1B26;--ok:#5BD19A;--ok-soft:#173627;--warn:#E3B04B;--warn-soft:#3A2E14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1115;--surface:#171A21;--ink:#ECEEF3;--mut:#9AA3B2;--line:#2A2F3A;--accent:#FF6B93;--accent-soft:#3A1B26;--ok:#5BD19A;--ok-soft:#173627;--warn:#E3B04B;--warn-soft:#3A2E14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:26px}
.wrap>*{min-width:0}
h1{font-size:28px;line-height:1.15;margin:0;text-wrap:balance}h2{font-size:18px;margin:0 0 10px}
p{margin:0}.mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.flow{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.flow svg{display:block;min-width:720px;width:100%;height:auto}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.phase header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.phase h3{margin:0;font-size:16px}.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.task label{cursor:pointer}.task .d{font-size:13px;color:var(--mut);display:block}
.task.done label{color:var(--mut);text-decoration:line-through}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.now{background:var(--warn-soft);color:var(--warn)}
.log{display:grid;gap:6px;font-size:14px}.log div{display:grid;grid-template-columns:5.6rem 1fr;gap:10px}.log time{color:var(--mut);font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--mut)}

 ["10-07","찾기 화면 개선: 검색하면 주제 칩과 세부 칩의 개수도 검색 결과에 맞게 바뀜(예: '허리' 검색 시 전체 1, 운동 1). 대본에 반영"],
 ["10-07","릴스 1편 대본 작성(m2). 배포본 확인에서 주제 칩 숫자는 검색해도 안 바뀌고 결과 줄에만 개수가 나옴을 확인해 대본에 반영"],
 ["10-07","지인 시험 양식 준비(m1). 카드의 '인스타에서 열기'가 인스타 첫 화면만 열리는 것은 삭제·비공개 게시물이라서이며 안내에 추가"],
 ["10-07","폰 시험(t5) 1대 통과: 드라이브로 옮긴 ZIP을 폰에 내려받은 뒤 선택, 결과까지 정상 동작"],
 ["10-07","폰 시험 첫 결과: PC에서 받은 ZIP을 구글 드라이브로 폰에 옮기는 단계에서 막힘. 안내에 '드라이브에서 폰으로 다운로드해야 고를 수 있다' 추가"],
 ["10-07","배포(d1): kc9302.github.io/Savvy 에서 열림. 배포본 확인: 페이지가 보내는 요청 0(브라우저의 파비콘 요청만 있음), 고지·피드백 섹션 포함, 개인 데이터 없음. 다음은 실제 폰 시험(t5)"],
 ["10-07","피드백(t7): 버튼 클릭 수는 서버 없이 셀 수 없어, GitHub Issues 링크와 DM·댓글 병행으로 결정. 성공 기준의 '시도' 정의 수정. GitHub Pages 켜기(d1)는 권한 분류기가 막아 사용자 직접 실행 대기"],
 ["10-07","수집 도구 2개를 공개 저장소에서 제거(t4). 저장소는 이미 공개 상태라 GitHub Pages 무료 사용 가능"],
 ["10-07","중간점검 시뮬레이션(6명): 지금 공개 3~4점, 고친 뒤 6~7점. 1순위는 실제 폰·인앱 ZIP 선택 시험. 성공 기준 산식 오류를 고치고(d3 개정), 고지와 안내 보강(읽은 파일 표시, 인앱 안내, 호스팅 접속 기록, 북마크 안내, CSV 주의, 문의 경로)"],
 ["10-07","고지 사항(t3)과 파일 고르기 안내(t6)를 index.html에 반영. 성공·중단 기준을 숫자로 확정(d3)"],
 ["10-07","이미지 글 읽기 356개 대상 완료: 263개 읽음, 93개 이미지 없음, 확신 높음 109·보통 97·낮음 49. 미분류 16개로 감소(PR #5)"]
];
let state={done:[]};try{state=JSON.parse(document.getElementById('state').textContent)}catch(e){}
try{const l=JSON.parse(localStorage.getItem('savvy-tracker')||'null');if(l&&Array.isArray(l.done))state=l}catch(e){}
const done=new Set(state.done);
function render(){
  const all=PHASES.flatMap(p=>p.tasks),n=all.length,d=all.filter(t=>done.has(t[0])||t[2]==='완료').length;
  document.getElementById('stat').innerHTML=`<span class="pill ok">완료 ${d}/${n}</span><span class="pill warn">진행 중: 공개 준비</span><span class="pill acc">다음: 카드 이미지 글 읽기</span>`;
  document.getElementById('phases').innerHTML=PHASES.map(p=>{const dd=p.tasks.filter(t=>done.has(t[0])||t[2]==='완료').length;
    return `<div class="phase"><header><h3>${p.name}</h3><span class="mut">${dd}/${p.tasks.length}</span></header><div class="bar"><i style="width:${dd/p.tasks.length*100}%"></i></div>`+
    p.tasks.map(([id,txt,st])=>{const chk=done.has(id)||st==='완료';return `<div class="task${chk?' done':''}"><input type="checkbox" id="${id}" ${chk?'checked':''}><label for="${id}">${txt}</label><span class="tag${st==='다음'||st==='해야 함'?' now':''}">${st}</span></div>`}).join('')+`</div>`}).join('');
  document.getElementById('log').innerHTML=LOG.map(([t,s])=>`<div><time>2026-${t}</time><span>${s}</span></div>`).join('');
  document.getElementById('foot').textContent=`체크 상태: ${state.saved==='artifact'?'이 페이지에 저장됨':'이 브라우저에 저장됨'} · 갱신 2026-10-07`;
}
document.getElementById('phases').addEventListener('change',async e=>{
  if(e.target.type!=='checkbox')return;
  e.target.checked?done.add(e.target.id):done.delete(e.target.id);
  state={done:[...done]};
  try{localStorage.setItem('savvy-tracker',JSON.stringify(state))}catch(err){}
  render();
  // 아티팩트로 열렸으면 페이지 자체를 새 버전으로 저장한다
  try{const art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
    if(art){const html=document.documentElement.outerHTML.replace(/<script id="state"[^>]*>[\s\S]*?<\/script>/,'<script id="state" type="application/json">'+JSON.stringify({done:[...done],saved:'artifact'})+'<\/script>');
      await art.publish('<!doctype html>'+html)}}catch(err){}
});
render();
})();
</script>
</body></html>
