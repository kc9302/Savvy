<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savvy 업무 추적</title>
<style>
/* 레이아웃: 상태 요약 → 프로세스 흐름(SVG) → 단계별 할 일 체크리스트 → 결정 기록. 체크 상태는 페이지 자체가 기억한다(아티팩트) 또는 이 브라우저에 남는다. */
:root{--bg:#F5F6F8;--surface:#FFFFFF;--ink:#15171C;--mut:#5F6676;--line:#E2E5EB;--accent:#D6285B;--accent-soft:#FCE6EE;--ok:#1E8E5A;--ok-soft:#DDF3E8;--warn:#B7791F;--warn-soft:#FBEFD6;
  --body:system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1115;--surface:#171A21;--ink:#ECEEF3;--mut:#9AA3B2;--line:#2A2F3A;--accent:#FF6B93;--accent-soft:#3A1B26;--ok:#5BD19A;--ok-soft:#173627;--warn:#E3B04B;--warn-soft:#3A2E14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1115;--surface:#171A21;--ink:#ECEEF3;--mut:#9AA3B2;--line:#2A2F3A;--accent:#FF6B93;--accent-soft:#3A1B26;--ok:#5BD19A;--ok-soft:#173627;--warn:#E3B04B;--warn-soft:#3A2E14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:26px}
.wrap>*{min-width:0}
h1{font-size:28px;line-height:1.15;margin:0;text-wrap:balance}h2{font-size:18px;margin:0 0 10px}
p{margin:0}.mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.flow{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.flow svg{display:block;min-width:720px;width:100%;height:auto}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.phase header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.phase h3{margin:0;font-size:16px}.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.task label{cursor:pointer}.task .d{font-size:13px;color:var(--mut);display:block}
.task.done label{color:var(--mut);text-decoration:line-through}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.now{background:var(--warn-soft);color:var(--warn)}
.log{display:grid;gap:6px;font-size:14px}.log div{display:grid;grid-template-columns:5.6rem 1fr;gap:10px}.log time{color:var(--mut);font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--mut)}
</style></head><body>
<main class="wrap">
  <header>
    <h1>Savvy 업무 추적</h1>
    <p class="mut">저장됨 취향 지도를 무료 웹으로 공개하고 릴스로 반응을 확인하기까지의 할 일. 체크하면 이 페이지에 저장됩니다.</p>
    <div class="stat" id="stat"></div>
  </header>

  <section>
    <h2>전체 프로세스</h2>
    <div class="flow" aria-label="프로세스 흐름도">
      <svg viewBox="0 0 1040 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowT"><title id="flowT">데이터 받기부터 반응 측정까지의 흐름</title>
        <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
        <g font-family="system-ui,sans-serif" font-size="13" fill="currentColor" color="var(--ink)">
          <!-- 1행: 사용자 흐름 -->
          <text x="20" y="28" font-size="12" fill="var(--mut)">사용자</text>
          <g>
            <rect x="20" y="40" width="150" height="54" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="95" y="63" text-anchor="middle">릴스 시청</text><text x="95" y="81" text-anchor="middle" font-size="11" fill="var(--mut)">인스타 인사이트로 측정</text>
            <rect x="200" y="40" width="150" height="54" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="275" y="63" text-anchor="middle">프로필 링크</text><text x="275" y="81" text-anchor="middle" font-size="11" fill="var(--mut)">링크 탭 수</text>
            <rect x="380" y="40" width="150" height="54" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="455" y="63" text-anchor="middle">페이지 · 샘플 먼저</text><text x="455" y="81" text-anchor="middle" font-size="11" fill="var(--mut)">외부 요청 0</text>
            <rect x="560" y="40" width="150" height="54" rx="10" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="635" y="63" text-anchor="middle">내 정보 다운로드 요청</text><text x="635" y="81" text-anchor="middle" font-size="11" fill="var(--mut)">최대 이탈 지점</text>
            <rect x="740" y="40" width="130" height="54" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="805" y="63" text-anchor="middle">기다림 → ZIP</text><text x="805" y="81" text-anchor="middle" font-size="11" fill="var(--mut)">알림·메일로 복귀</text>
            <rect x="900" y="40" width="120" height="54" rx="10" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="960" y="63" text-anchor="middle">ZIP 선택 → 결과</text><text x="960" y="81" text-anchor="middle" font-size="11" fill="var(--mut)">찾기 · 세부 태그</text>
            <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)"><path d="M170 67H198"/><path d="M350 67H378"/><path d="M530 67H558"/><path d="M710 67H738"/><path d="M870 67H898"/></g>
          </g>
          <!-- 2행: 데이터 처리 (페이지 안) -->
          <text x="20" y="140" font-size="12" fill="var(--mut)">페이지 안 (기기에서만)</text>
          <g>
            <rect x="20" y="152" width="170" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="105" y="182" text-anchor="middle">ZIP 읽기 · 한글 복원</text>
            <rect x="220" y="152" width="170" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="305" y="182" text-anchor="middle">주제 규칙 (31)</text>
            <rect x="420" y="152" width="170" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="505" y="182" text-anchor="middle">세부 태그 규칙 (37)</text>
            <rect x="620" y="152" width="170" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="705" y="182" text-anchor="middle">찾기 · 취향 · 카드 · CSV</text>
            <rect x="820" y="152" width="200" height="50" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-dasharray="5 4"/><text x="920" y="175" text-anchor="middle">다음: 카드 이미지 글 읽기</text><text x="920" y="192" text-anchor="middle" font-size="11" fill="var(--mut)">세부 태그 정확도 보강</text>
            <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)"><path d="M190 177H218"/><path d="M390 177H418"/><path d="M590 177H618"/><path d="M820 177H792" /></g>
          </g>
          <!-- 3행: 만드는 쪽 -->
          <text x="20" y="248" font-size="12" fill="var(--mut)">만드는 쪽</text>
          <g>
            <rect x="20" y="260" width="150" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="95" y="290" text-anchor="middle">시뮬레이션 3종</text>
            <rect x="200" y="260" width="150" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="275" y="290" text-anchor="middle">B+C 합본 · 세부 태그</text>
            <rect x="380" y="260" width="150" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="455" y="290" text-anchor="middle">실기기 검증 · 고지</text>
            <rect x="560" y="260" width="150" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="635" y="290" text-anchor="middle">정적 웹 공개 (무료)</text>
            <rect x="740" y="260" width="130" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="805" y="290" text-anchor="middle">지인 5명 → 릴스</text>
            <rect x="900" y="260" width="120" height="50" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="960" y="290" text-anchor="middle">2주 판정</text>
            <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#ah)"><path d="M170 285H198"/><path d="M350 285H378"/><path d="M530 285H558"/><path d="M710 285H738"/><path d="M870 285H898"/></g>
          </g>
        </g>
      </svg>
    </div>
    <p class="mut" style="font-size:13px;margin-top:8px">저장소 코드 구조 그래프는 graphify로 따로 만들었습니다(graphify-out/graph.html, 85 노드).</p>
  </section>

  <section id="phases"></section>

  <section>
    <h2>결정 기록</h2>
    <div class="log" id="log"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>

<script id="state" type="application/json">{"done":[]}</script>
<script>
(()=>{
const PHASES=[
 {name:"1. 분류·화면",tasks:[
  ["s1","B+C 합본: 찾기 탭(검색, 주제 칩, 세부 칩, 태그 카드)과 취향 탭","완료"],
  ["s2","세부 태그 규칙 37줄(운동 13, 커리어 4, 재테크 4, 맛집 4, 요리 3, 살림 2, 가족 3, 여행 2, 마음 2)","완료"],
  ["s3","카드 이미지 안의 글 읽기(캡션에 없는 본문)로 세부 태그 보강. 캡션 부실·미분류 약 600개부터","다음"],
  ["s4","세부 태그 정확도 표본 100개로 측정해 화면에 표시","다음"],
  ["s5","여러 장 카드(캐러셀) 전부 읽기. 먼저 전체 장수 집계","검토"]]},
 {name:"2. 신뢰·공개 준비",tasks:[
  ["t1","ZIP 라이브러리 내장, 외부 폰트 제거 → 외부 요청 0","완료"],
  ["t2","개발자도구 네트워크 탭에서 외부 요청 0 확인 후에만 '밖으로 안 나가요' 문구 유지","해야 함"],
  ["t3","고지 3항목: 처리 범위와 예외, 인스타·Meta 비공식, 사용자 책임과 한계","해야 함"],
  ["t4","스크래핑 보조 도구는 공개판에서 제외(저장소 tools/ 는 별도 안내)","해야 함"],
  ["t5","실제 폰 iOS 1대, Android 1대에서 ZIP 선택→결과. 인스타 인앱 브라우저에서도","해야 함"],
  ["t6","파일 고르기 안내: ZIP 풀지 말기, 파일명 예시, 폰별 캡처, 실패 시 대처","해야 함"],
  ["t7","결과 화면에 '도움이 됐어요 / 막혔어요' 자발적 피드백(전송 내용 표시)","해야 함"]]},
 {name:"3. 공개(정적 웹, 무료)",tasks:[
  ["d1","GitHub Pages 또는 Cloudflare Pages 무료 범위로 index.html 배포. 주소 확정","해야 함"],
  ["d2","짧은 주소 1개(클릭 수만 세는 것, 고지에 명시)","검토"],
  ["d3","성공·중단 기준을 숫자로 적어 두기(공개 전)","해야 함"],
  ["d4","PWA(홈 화면 추가, 오프라인)는 재방문이 확인되면","검토"],
  ["d5","앱 스토어는 파일 선택이 막히거나 요청이 반복될 때만. 등록비 확인 필요","보류"]]},
 {name:"4. 반응 확인",tasks:[
  ["m1","지인 5명 시험: 완주 여부와 막힌 지점 메모","해야 함"],
  ["m2","릴스 2~3편. 1순위 소재: '저장 2,436개, 못 찾겠다' + 스크롤 화면. 시연은 더미 데이터","해야 함"],
  ["m3","측정: 릴스 조회·저장·공유·프로필 방문·링크 탭 + DM·댓글 + 피드백 버튼","해야 함"],
  ["m4","2주 판정. 계속: 링크 탭 1% 이상이고 파일 요청 해본 응답 5명 이상(추정치, 첫 주에 보정)","해야 함"]]}
];
const LOG=[
 ["10-05","인스타 공식 내보내기가 저장됨을 누락해 공개 임베드로 캡션 2,261개 보강"],
 ["10-05","상품화 시뮬레이션(6명): 유료는 이르고 개인용→오픈소스 순서"],
 ["10-07","유저 반응 시뮬레이션(8명, 3라운드): 찾기 우선형 + 개수 표시(B+C) 채택"],
 ["10-07","배포 시뮬레이션(6명): 정적 웹 무료로 시작, 앱 스토어 보류, 외부 요청 0, 릴스 지표+자발 피드백으로 측정"],
 ["10-07","카드 이미지 글 읽기를 세부 태그 보강의 다음 단계로 결정"]
];
let state={done:[]};try{state=JSON.parse(document.getElementById('state').textContent)}catch(e){}
try{const l=JSON.parse(localStorage.getItem('savvy-tracker')||'null');if(l&&Array.isArray(l.done))state=l}catch(e){}
const done=new Set(state.done);
function render(){
  const all=PHASES.flatMap(p=>p.tasks),n=all.length,d=all.filter(t=>done.has(t[0])||t[2]==='완료').length;
  document.getElementById('stat').innerHTML=`<span class="pill ok">완료 ${d}/${n}</span><span class="pill warn">진행 중: 공개 준비</span><span class="pill acc">다음: 카드 이미지 글 읽기</span>`;
  document.getElementById('phases').innerHTML=PHASES.map(p=>{const dd=p.tasks.filter(t=>done.has(t[0])||t[2]==='완료').length;
    return `<div class="phase"><header><h3>${p.name}</h3><span class="mut">${dd}/${p.tasks.length}</span></header><div class="bar"><i style="width:${dd/p.tasks.length*100}%"></i></div>`+
    p.tasks.map(([id,txt,st])=>{const chk=done.has(id)||st==='완료';return `<div class="task${chk?' done':''}"><input type="checkbox" id="${id}" ${chk?'checked':''}><label for="${id}">${txt}</label><span class="tag${st==='다음'||st==='해야 함'?' now':''}">${st}</span></div>`}).join('')+`</div>`}).join('');
  document.getElementById('log').innerHTML=LOG.map(([t,s])=>`<div><time>2026-${t}</time><span>${s}</span></div>`).join('');
  document.getElementById('foot').textContent=`체크 상태: ${state.saved==='artifact'?'이 페이지에 저장됨':'이 브라우저에 저장됨'} · 갱신 2026-10-07`;
}
document.getElementById('phases').addEventListener('change',async e=>{
  if(e.target.type!=='checkbox')return;
  e.target.checked?done.add(e.target.id):done.delete(e.target.id);
  state={done:[...done]};
  try{localStorage.setItem('savvy-tracker',JSON.stringify(state))}catch(err){}
  render();
  // 아티팩트로 열렸으면 페이지 자체를 새 버전으로 저장한다
  try{const art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
    if(art){const html=document.documentElement.outerHTML.replace(/<script id="state"[^>]*>[\s\S]*?<\/script>/,'<script id="state" type="application/json">'+JSON.stringify({done:[...done],saved:'artifact'})+'<\/script>');
      await art.publish('<!doctype html>'+html)}}catch(err){}
});
render();
})();
</script>
</body></html>
